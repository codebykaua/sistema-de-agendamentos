<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinAgenda | Login</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-visual">
      <div class="visual-card">
        <div class="visual-title">
          <div class="visual-main-icon">
            <i class="fa-solid fa-wave-square"></i>
          </div>
          <h2>Excelência em<br />Gestão</h2>
        </div>

        <p class="visual-description">
          Uma plataforma estruturada para elevar o padrão de atendimento
          clínico. Organize agendas, atendimentos e fluxos com precisão e
          uma experiência profissional.
        </p>

        <div class="visual-icons">
          <span><i class="fa-regular fa-calendar-days"></i></span>
          <span><i class="fa-solid fa-notes-medical"></i></span>
          <span><i class="fa-solid fa-shield-halved"></i></span>
        </div>
      </div>
    </section>

    <section class="login-content">
      <div class="login-box">
        <div class="brand">
          <div class="brand-top">
            <div class="brand-icon">
              <i class="fa-solid fa-shield-heart"></i>
            </div>
            <h1>ClinAgenda</h1>
          </div>
          <span class="brand-subtitle">SISTEMA INTERNO DE AGENDAMENTO</span>
        </div>

        <div class="login-header">
          <h2>Acessar painel</h2>
          <p>Entre com suas credenciais para acessar o sistema.</p>
        </div>

        <form id="loginForm" class="login-form">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-group">
              <i class="fa-regular fa-envelope"></i>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="nome@clinica.com.br"
                autocomplete="email"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <div class="input-group">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="toggleSenha"
                aria-label="Mostrar ou ocultar senha"
              >
                <i class="fa-regular fa-eye-slash"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login">
            <span>Entrar</span>
            <i class="fa-solid fa-arrow-right"></i>
          </button>

          <p id="mensagemErro" class="mensagem-erro"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="storage.js"></script>
  <script src="login.js"></script>
</body>
</html>
