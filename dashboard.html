<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinAgenda | Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
</head>
<body class="dashboard-page">
  <main class="dashboard-container">
    <header class="dashboard-header">
      <div class="dashboard-brand">
        <div class="dashboard-logo">
          <i class="fa-solid fa-shield-heart"></i>
        </div>
        <div>
          <h1>ClinAgenda</h1>
        </div>
      </div>

      <div class="dashboard-user">
        <div class="header-actions">
          <button type="button" id="btnRestaurarDemo" class="btn-reset-demo">
            <i class="fa-solid fa-rotate-left"></i>
            Restaurar dados
          </button>

          <button type="button" id="btnSair" class="btn-logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            Sair
          </button>
        </div>
      </div>
    </header>

    <section class="dashboard-main single-column">
      <section class="appointments-area appointments-area-full">
        <div class="section-title section-title-actions">
          <div>
            <h2>Agendamentos</h2>
            <p>Pesquise, acompanhe e atualize os atendimentos da clínica.</p>
          </div>

          <div class="section-actions">
            <span id="totalAgendamentos" class="total-badge">0 agendamentos</span>
            <button type="button" id="btnAbrirModal" class="btn-primary-action">
              <i class="fa-solid fa-calendar-plus"></i>
              Cadastrar agendamento
            </button>
          </div>
        </div>

        <div class="filters-card">
          <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input
              type="text"
              id="buscarAgendamento"
              placeholder="Buscar por paciente, médico ou serviço"
            />
          </div>

          <div class="filters-row">
            <div class="filter-group">
              <label for="filtroData">Data</label>
              <input type="date" id="filtroData" />
            </div>

            <div class="filter-group">
              <label for="filtroStatus">Status</label>
              <select id="filtroStatus">
                <option value="">Todos</option>
                <option value="Pendente">Pendente</option>
                <option value="Confirmado">Confirmado</option>
                <option value="Em atendimento">Em atendimento</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Cancelado">Cancelado</option>
              </select>
            </div>

            <button type="button" id="btnLimparFiltros" class="btn-clear">
              <i class="fa-solid fa-filter-circle-xmark"></i>
              Limpar
            </button>
          </div>

          <p id="mensagemDashboard" class="mensagem-dashboard"></p>
        </div>

        <div id="listaAgendamentos" class="appointments-list">
          <div class="empty-state">
            <i class="fa-regular fa-calendar-check"></i>
            <h3>Nenhum agendamento encontrado</h3>
            <p>Clique em “Cadastrar agendamento” para adicionar um novo atendimento.</p>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div id="modalAgendamento" class="modal-overlay" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTituloAgendamento">
      <div class="modal-header">
        <div>
          <h2 id="modalTituloAgendamento">Cadastrar agendamento</h2>
          <p>Preencha os dados do atendimento.</p>
        </div>

        <button type="button" id="btnFecharModal" class="btn-modal-close" aria-label="Fechar janela">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="formAgendamento" class="appointment-form modal-form">
        <div class="form-group">
          <label for="paciente">Paciente</label>
          <input
            type="text"
            id="paciente"
            name="paciente"
            placeholder="Nome do paciente"
            required
          />
        </div>

        <div class="form-group">
          <label for="medico">Médico</label>
          <input
            type="text"
            id="medico"
            name="medico"
            placeholder="Nome do médico"
            required
          />
        </div>

        <div class="form-group">
          <label for="servico">Serviço</label>
          <input
            type="text"
            id="servico"
            name="servico"
            placeholder="Ex: Consulta de rotina"
            required
          />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="data">Data</label>
            <input type="date" id="data" name="data" required />
          </div>

          <div class="form-group">
            <label for="horario">Horário</label>
            <input type="time" id="horario" name="horario" required />
          </div>
        </div>

        <div class="form-group">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="Pendente">Pendente</option>
            <option value="Confirmado">Confirmado</option>
            <option value="Em atendimento">Em atendimento</option>
            <option value="Finalizado">Finalizado</option>
            <option value="Cancelado">Cancelado</option>
          </select>
        </div>

        <div class="form-group">
          <label for="observacao">Observação</label>
          <textarea
            id="observacao"
            name="observacao"
            placeholder="Observações sobre o atendimento"
          ></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="btnCancelarModal" class="btn-secondary-action">
            Cancelar
          </button>

          <button type="submit" class="btn-save">
            <i class="fa-solid fa-check"></i>
            Confirmar agendamento
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
